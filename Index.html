<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visite virtuelle RGF Staffing IT France</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            background:
                linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
                url("17973908.jpg") center/cover no-repeat;

            animation: fadeIn 0.8s ease-out;
        }

        /* entrée plus clean */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(1.02);
                filter: blur(6px);
            }
            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0px);
            }
        }

        /* léger zoom du fond (pro) */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: inherit;
            z-index: -1;
            transform: scale(1);
            animation: bgZoom 12s ease-in-out infinite alternate;
        }

        @keyframes bgZoom {
            from { transform: scale(1); }
            to { transform: scale(1.04); }
        }

        /* LOGO */
        .logo {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 260px;
            opacity: 0;
            animation: fadeLogo 1s ease forwards;
        }

        @keyframes fadeLogo {
            to { opacity: 1; }
        }

        /* CONTENU */
        .contenu {
            text-align: center;
            animation: slideUp 0.9s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(25px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            font-size: 46px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        /* 🌟 BOUTON FINAL PRO */
        .bouton {
            background: #0078D7;
            color: white;

            padding: 14px 28px;
            border: none;
            border-radius: 10px;

            font-size: 18px;
            cursor: pointer;

            transition: 0.25s ease;
            position: relative;
        }

        .bouton:hover {
            transform: scale(1.06);
            box-shadow: 0 0 18px rgba(0,120,215,0.7);
        }

        .bouton:active {
            transform: scale(0.98);
        }

        /* 🌟 TRANSITION SORTIE ULTRA CLEAN */
        .fade-out {
            animation: fadeOut 0.6s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(1.06);
                filter: blur(6px);
            }
        }

    </style>

</head>

<body>

    <img src="Logo-RGF.png" alt="Logo RGF" class="logo">

    <div class="contenu">

        <h1>Visite virtuelle des locaux</h1>

        <p>
            Découvrez les espaces de travail de RGF Staffing IT France
            à travers une visite interactive.
        </p>

        <button class="bouton" onclick="goVisit()">
            Visiter les locaux
        </button>

    </div>

    <script>
        function goVisit() {
            document.body.classList.add("fade-out");

            setTimeout(() => {
                window.location.href = "visite.html";
            }, 600);
        }
    </script>

</body>

</html>
